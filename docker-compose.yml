services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: tcc
      DB_USER: root
      DB_PASS: root
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tcc

    volumes:
      - ./documentação/bancoDeDados/createFinalSemComentarios.sql:/docker-entrypoint-initdb.d/01-schema.sql